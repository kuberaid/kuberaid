[package]
name = "kuberaid"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"

[dependencies]
kube = { version = "3", features = ["runtime", "derive"] }
k8s-openapi = { version = "0.27.1", features = ["latest", "schemars"] }
schemars = { version = "1" }
serde = { version ="1", features = ["derive"]}
serde_json = "1"
tracing-subscriber = "0.3"
tracing = "0.1"
serde_yaml = "0.9"
