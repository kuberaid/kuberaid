apiVersion: v1
kind: Pod
metadata:
  name: zfs-shell
  namespace: kube-system
spec:
  hostIPC: true
  hostNetwork: true
  hostPID: true
  containers:
    - command: ["sleep", "infinity"]
      image: debian
      name: shell
      securityContext:
        privileged: true
      volumeMounts:
        - mountPath: /host
          mountPropagation: HostToContainer
          name: host
          readOnly: true
  volumes:
    - hostPath:
        path: /
        type: Directory
      name: host
